spring.application.name=demo
app.loyalty.points-per-discount=100
app.loyalty.discount-per-block=10.00
spring.data.mongodb.uri=mongodb://localhost:27017/restaurant
server.error.include-message=always

# Stripe test mode. Real values come from environment variables, never from this file -
# see PAYMENT_GATEWAY.md for setup steps. Test keys never move real money.
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_REPLACE_WITH_YOUR_TEST_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_REPLACE_WITH_YOUR_WEBHOOK_SIGNING_SECRET}
app.base-url=http://localhost:8080