<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff</title>
  <link rel="stylesheet" href="/style.css">
  <!-- Draws the QR images. Needs internet. -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body class="staff-page">
  <!-- Login -->
  <div id="login-box" class="card narrow">
    <div class="login-visual">
      <div class="brand-mark"><span class="brand-logo"><i class="fa-solid fa-utensils"></i></span><span>Restaurant<small>Kitchen · Grill · Table</small></span></div>
    </div>
    <h1>Staff login</h1>
    <p class="muted login-sub">Sign in to open the kitchen, orders and admin dashboard.</p>
    <label for="username">Username</label>
    <input id="username" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="actions"><button id="login-button">Log in</button></div>
    <p id="login-error" class="error"></p>
  </div>

  <!-- Dashboard, shown after login -->
  <div id="dashboard" class="page wide hidden">
    <!-- Top bar: the same #tabs, #who, #role and #logout-button elements as before,
         only arranged into one navigation bar. The profile menu opens with CSS
         (:hover / :focus-within), so no script is involved. -->
    <header class="dash-topbar no-print">
      <span class="brand-logo" title="Restaurant"><i class="fa-solid fa-bell-concierge"></i></span>
      <nav id="tabs" class="tabs no-print"></nav>
      <div class="topbar-right">
        <label class="topbar-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="panel-search" type="search" placeholder="Search" aria-label="Search this page">
        </label>
        <span class="live-pill"><span class="dot"></span> Live service<span id="live-clock" class="live-clock"></span></span>
        <button id="bell-button" class="icon-button" type="button" title="No orders waiting to be served">
          <i class="fa-regular fa-bell"></i><span class="bell-dot hidden"></span>
        </button>
        <div class="profile" tabindex="0">
          <span id="avatar" class="avatar"><i class="fa-solid fa-user"></i></span>
          <div class="profile-text">
            <h1 id="who"></h1>
            <div id="role" class="muted"></div>
          </div>
          <i class="fa-solid fa-chevron-down profile-caret"></i>
          <div class="profile-menu">
            <button id="logout-button" class="secondary"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log out</button>
          </div>
        </div>
      </div>
    </header>
    <p id="message" class="no-print"></p>
    <div id="receipt" class="no-print"></div>
    <div id="panel"></div>

    <!-- Decorative footer only: no ids, nothing the scripts touch. -->
    <footer class="site-footer dash-footer no-print">
      <p class="footer-note"><i class="fa-solid fa-fire-flame-curved"></i> Great food · Great service · Great team</p>
    </footer>
  </div>

  <script src="/app.js"></script>
  <script>
    // Only these sections have pages. A role may list more; unknown ones are skipped.
    // "needs" is the role section that allows the tab (default: its own name).
    const SECTIONS = {
      orders:    { label: 'Orders',          show: showOrders },
      neworder:  { label: 'New order',       show: showNewOrder, needs: 'orders' },
      qr:        { label: 'Table QR codes',  show: showQr,       needs: 'orders' },
      menu:      { label: 'Menu',            show: showMenu },
      staff:     { label: 'Staff',           show: showStaff },
      customers: { label: 'Customers',       show: showCustomers }
    };

    let auth = null;          // the Basic token, kept for this browser tab only
    let currentUserId = null; // the logged-in account's id, so it can't deactivate itself
    let currentUserName = ''; // shown in the Orders banner greeting
    let timer = null;         // refresh timer of the Orders tab
    const phones = {};        // table code -> phone number typed for payment

    const panel = document.getElementById('panel');
    const message = document.getElementById('message');
    const receiptBox = document.getElementById('receipt');

    function say(text, isError) {
      message.textContent = text || '';
      message.className = isError ? 'error' : 'ok';
    }

    // ---------- Login ----------

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const error = document.getElementById('login-error');
      error.textContent = '';
      try {
        const token = basicToken(username, password);
        const profile = await api('/api/auth/login', 'POST', { username: username, password: password });
        auth = token;
        sessionStorage.setItem('auth', token);
        openDashboard(profile);
      } catch (e) {
        error.textContent = e.message;
      }
    }

    function logout() {
      clearInterval(timer);
      auth = null;
      sessionStorage.removeItem('auth');
      document.getElementById('password').value = '';
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('login-box').classList.remove('hidden');
      document.body.classList.remove('bg-orders', 'bg-staff', 'bg-customers');
    }

    // A 401 means the saved login no longer works, so go back to the login box.
    function handleError(e) {
      if (e.status === 401) { logout(); return; }
      say(e.message, true);
    }

    function openDashboard(profile) {
      currentUserId = profile.id;
      currentUserName = profile.fullName || '';
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('who').textContent = profile.fullName;
      document.getElementById('role').textContent = profile.role;
      const initials = (profile.fullName || '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
      if (initials) document.getElementById('avatar').textContent = initials;

      const tabs = document.getElementById('tabs');
      tabs.replaceChildren();
      const names = Object.keys(SECTIONS).filter(
        name => profile.dashboardSections.includes(SECTIONS[name].needs || name));
      for (const name of names) {
        const button = el('button', SECTIONS[name].label);
        button.dataset.section = name;
        button.onclick = () => openSection(name);
        tabs.append(button);
      }
      document.getElementById('bell-button').classList.toggle('hidden', !names.includes('orders'));
      if (names.length > 0) openSection(names[0]);
    }

    // Orders/Staff/Customers each get their own full-page background photo; other
    // tabs fall back to the plain dark background.
    const BACKGROUND_TABS = ['orders', 'staff', 'customers'];

    // The top-bar search hides cards and table rows on the current page that don't
    // contain the typed text. It reapplies whenever the panel redraws (e.g. the
    // Orders tab's 5-second refresh), so the filter survives a refresh.
    const search = document.getElementById('panel-search');

    function applySearch() {
      const q = search.value.trim().toLowerCase();
      for (const item of panel.querySelectorAll('.card, .dish-card, tbody tr')) {
        item.classList.toggle('search-hidden', q !== '' && !item.textContent.toLowerCase().includes(q));
      }
    }
    search.oninput = applySearch;
    new MutationObserver(applySearch).observe(panel, { childList: true, subtree: true });

    // Wall clock in the "Live service" pill.
    const liveClock = document.getElementById('live-clock');
    const tickClock = () => { liveClock.textContent = timeText(new Date()); };
    tickClock();
    setInterval(tickClock, 15000);

    // The bell jumps to the Orders tab; drawOrders lights its dot when food is ready.
    document.getElementById('bell-button').onclick = () => {
      if (document.querySelector('#tabs [data-section="orders"]')) openSection('orders');
    };

    // Tab switches slide the page toward the chosen tab while crossfading (View
    // Transitions API): a tab to the right slides the page left, a tab to the left
    // slides it right. The transition waits briefly for the new tab's data so it lands
    // on the real page; if the data is slower, it lands on the loading state instead.
    // Browsers without the API, or with reduced motion on, get the plain entrance.
    const CROSSFADE_WAIT_MS = 400;
    let navTransitionId = 0;

    function openSection(name) {
      const canCrossfade = document.startViewTransition &&
        !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!canCrossfade) {
        switchSection(name, true);
        return;
      }

      // style.css reads data-nav-dir to pick the slide direction.
      const tabButtons = [...document.getElementById('tabs').children];
      const from = tabButtons.findIndex(b => b.classList.contains('active'));
      const to = tabButtons.findIndex(b => b.dataset.section === name);
      const root = document.documentElement;
      root.dataset.navDir = from !== -1 && to < from ? 'back' : 'forward';
      const id = ++navTransitionId;

      const transition = document.startViewTransition(() => Promise.race([
        switchSection(name, false),
        new Promise(resolve => setTimeout(resolve, CROSSFADE_WAIT_MS))
      ]));
      // Only the latest switch clears the flag, so a quick second click keeps its own.
      transition.finished.finally(() => {
        if (id === navTransitionId) delete root.dataset.navDir;
      });
    }

    function switchSection(name, animate) {
      clearInterval(timer);
      say('');
      search.value = '';
      receiptBox.replaceChildren();
      for (const button of document.getElementById('tabs').children) {
        button.classList.toggle('active', button.dataset.section === name);
      }
      for (const tab of BACKGROUND_TABS) document.body.classList.toggle('bg-' + tab, tab === name);
      panel.replaceChildren(loadingState('Loading ' + SECTIONS[name].label.toLowerCase() + '...'));
      // Retriggers the panel's entrance animation only on an actual tab switch,
      // not on every periodic refresh inside a section. Skipped under a crossfade,
      // which already animates the change.
      panel.classList.remove('panel-enter');
      if (animate) {
        void panel.offsetWidth;
        panel.classList.add('panel-enter');
      }
      return SECTIONS[name].show();
    }

    // ---------- Orders: kitchen queue and counter payment ----------

    const NEXT = {
      PENDING:   { status: 'PREPARING', label: 'Start preparing', icon: 'fa-fire-burner' },
      PREPARING: { status: 'READY',     label: 'Mark ready',      icon: 'fa-bell' },
      READY:     { status: 'SERVED',    label: 'Mark served',     icon: 'fa-check' }
    };

    // The Orders banner is built once per visit and reused by every refresh, so its
    // category carousel keeps its scroll position and photos don't reload every 5s.
    let ordersBanner = null;
    // Order ids seen on the previous refresh, so tickets that just arrived can be
    // highlighted. null on a fresh visit: nothing is "new" on the first draw.
    let knownOrderIds = null;

    async function showOrders() {
      ordersBanner = null;
      knownOrderIds = null;
      await refreshOrders();
      timer = setInterval(refreshOrders, 5000);
    }

    async function refreshOrders() {
      try {
        // The today count is extra: if it fails, the kitchen queue still draws.
        const [orders, tables, today] = await Promise.all([
          api('/api/staff/orders', 'GET', null, auth),
          api('/api/staff/tables', 'GET', null, auth),
          api('/api/staff/orders/today', 'GET', null, auth).catch(() => null)
        ]);
        if (!ordersBanner) ordersBanner = ordersBannerWithCategories(tables);
        drawOrders(orders, tables, today ? today.totalOrders : null);
      } catch (e) { handleError(e); }
    }

    // Orders banner with a scrollable row of menu categories on the right. The menu is
    // read through the first table's code (the same call the New order tab uses); if
    // that fails the banner simply shows without the row.
    function ordersBannerWithCategories(tables) {
      const aside = el('div', null, 'banner-aside');
      const banner = pageBanner('banner-orders', 'Every ticket tells a story of service.', aside);
      const hour = new Date().getHours();
      const partOfDay = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
      const firstName = currentUserName.split(/\s+/)[0];
      banner.querySelector('.page-banner-quote')
        .prepend(el('div', partOfDay + (firstName ? ', ' + firstName : ''), 'page-banner-greeting'));
      if (!tables.length) return banner;

      api('/api/menu?t=' + encodeURIComponent(tables[0].qrCodeHash)).then(menu => {
        const firstDish = {};
        for (const dish of menu) if (!firstDish[dish.category]) firstDish[dish.category] = dish.name;
        const categories = Object.keys(firstDish);
        if (!categories.length) return;

        const track = el('div', null, 'banner-cats');
        const canOrder = !!document.querySelector('#tabs [data-section="neworder"]');
        for (const category of categories) {
          const item = el(canOrder ? 'button' : 'div', null, 'banner-cat');
          if (canOrder) {
            item.type = 'button';
            item.title = 'New order';
            item.onclick = () => openSection('neworder');
          }
          item.append(dishImage(firstDish[category]), el('span', category));
          track.append(item);
        }
        const arrow = (icon, dir, label) => {
          const button = el('button', null, 'banner-arrow');
          button.type = 'button';
          button.setAttribute('aria-label', label);
          button.innerHTML = '<i class="fa-solid ' + icon + '"></i>';
          button.onclick = () => track.scrollBy({ left: dir * 220, behavior: 'smooth' });
          return button;
        };
        aside.append(arrow('fa-chevron-left', -1, 'Previous categories'), track, arrow('fa-chevron-right', 1, 'More categories'));
        banner.classList.add('has-aside');
      }).catch(() => {});
      return banner;
    }

    // Kitchen queue is split into one column per status, so orders at different
    // stages are never mixed in the same row.
    const STATUS_COLUMNS = [
      { status: 'PENDING',   label: 'Pending' },
      { status: 'PREPARING', label: 'Preparing' },
      { status: 'READY',     label: 'Ready' },
      { status: 'SERVED',    label: 'Served' }
    ];

    function statusColumn(def, matching, tableById) {
      const column = el('div', null, 'status-column');
      const head = el('div', null, 'status-column-head');
      head.append(el('span', def.label, 'badge ' + def.status), el('span', matching.length, 'status-column-count'));
      column.append(head);
      for (const order of matching) column.append(orderCard(order, tableById[order.tableId]));
      return column;
    }

    function drawOrders(orders, tables, todayTotal) {
      const tableById = {};
      for (const t of tables) tableById[t.id] = t;

      // Columns with nothing in them are left out entirely (not just emptied), so the
      // board doesn't waste width on "Pending"/"Served" when the kitchen is quiet.
      const board = el('div', null, 'status-board');
      for (const def of STATUS_COLUMNS) {
        const matching = orders.filter(o => o.status === def.status);
        if (matching.length) board.append(statusColumn(def, matching, tableById));
      }

      // Tickets that weren't there on the last refresh get a brief glow and a "New" tag.
      if (knownOrderIds) {
        for (const card of board.querySelectorAll('.order-card')) {
          if (!knownOrderIds.has(card.dataset.orderId)) {
            card.classList.add('is-new');
            card.querySelector('.row .name').append(el('span', 'New', 'new-tag'));
          }
        }
      }
      knownOrderIds = new Set(orders.map(o => String(o.id)));

      // A table can be paid when every open order on it is SERVED.
      const byTable = {};
      for (const order of orders) (byTable[order.tableId] = byTable[order.tableId] || []).push(order);
      const payBox = el('div', null, 'grid');
      for (const tableId of Object.keys(byTable)) {
        const group = byTable[tableId];
        if (group.every(o => o.status === 'SERVED') && tableById[tableId]) {
          payBox.append(payCard(tableById[tableId], group));
        }
      }

      // Visual-only counts from the orders already fetched above; no extra API calls.
      const servedCount = orders.filter(o => o.status === 'SERVED').length;
      const preparingCount = orders.filter(o => o.status === 'PREPARING' || o.status === 'PENDING').length;
      const stats = statsRow([
        { icon: 'fa-bowl-food', value: orders.length, label: 'Open orders' },
        { icon: 'fa-fire-burner', value: preparingCount, label: 'In the kitchen' },
        { icon: 'fa-check-double', value: servedCount, label: 'Served, awaiting payment', accent: true },
        { icon: 'fa-receipt', value: payBox.children.length, label: 'Tables ready to pay' }
      ]);

      // Live count on the Orders tab, and the bell's dot when food is waiting to go out.
      const ordersTab = document.querySelector('#tabs [data-section="orders"]');
      if (ordersTab) ordersTab.dataset.count = orders.length;
      const readyCount = orders.filter(o => o.status === 'READY').length;
      const bell = document.getElementById('bell-button');
      bell.querySelector('.bell-dot').classList.toggle('hidden', readyCount === 0);
      bell.title = readyCount
        ? readyCount + (readyCount === 1 ? ' order' : ' orders') + ' ready to serve'
        : 'No orders waiting to be served';

      panel.replaceChildren(
        ordersBanner,
        kitchenGlance(stats, orders),
        sectionHeading('Kitchen queue', orders.length + (orders.length === 1 ? ' ticket' : ' tickets')),
        orders.length ? board : emptyState('fa-mug-hot', 'No open orders. New orders will appear here.'),
        sectionHeading('Ready to pay', payBox.children.length + (payBox.children.length === 1 ? ' table' : ' tables')),
        payBox.children.length ? payBox : emptyState('fa-receipt', 'No table is ready to pay yet.'),
        todaySide(todayTotal, orders)
      );
    }

    // The stat tiles (2 x 2) with two small charts beside them, drawn from the open
    // orders already fetched — no extra API calls.
    function kitchenGlance(stats, orders) {
      const glance = el('div', null, 'kitchen-glance');
      glance.append(stats, ordersByHourCard(orders), statusMixCard(orders));
      return glance;
    }

    function glanceCard(title, sub) {
      const card = el('div', null, 'glance-card');
      const head = el('div', null, 'glance-head');
      head.append(el('div', title, 'glance-title'), el('div', sub, 'glance-sub'));
      card.append(head);
      return card;
    }

    // Bar per hour for the last 8 hours: how many of the open orders were placed then.
    function ordersByHourCard(orders) {
      const HOURS = 8;
      const now = new Date();
      const counts = new Array(HOURS).fill(0);
      for (const order of orders) {
        const hoursAgo = Math.floor(minutesSince(order.createdAt) / 60);
        if (hoursAgo < HOURS) counts[HOURS - 1 - hoursAgo]++;
      }
      const max = Math.max(1, ...counts);
      const peak = counts.indexOf(Math.max(...counts));

      const W = 240, H = 120, BASE = 98, TOP = 16, slot = W / HOURS, barW = slot - 10, r = 4;
      let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Open orders by hour placed">' +
        '<line x1="0" y1="' + BASE + '" x2="' + W + '" y2="' + BASE + '" class="chart-baseline"/>';
      counts.forEach((count, i) => {
        const hour = (now.getHours() - (HOURS - 1 - i) + 24) % 24;
        const label = String(hour).padStart(2, '0') + ':00';
        const x = i * slot + 5;
        const h = (count / max) * (BASE - TOP);
        // Bars are rounded only at the top so they sit flat on the baseline.
        if (count) {
          const y = BASE - h, rr = Math.min(r, h);
          svg += '<path class="chart-bar' + (i === peak ? ' peak' : '') + '" d="M' + x + ' ' + BASE + 'V' + (y + rr) +
            'Q' + x + ' ' + y + ' ' + (x + rr) + ' ' + y + 'H' + (x + barW - rr) +
            'Q' + (x + barW) + ' ' + y + ' ' + (x + barW) + ' ' + (y + rr) + 'V' + BASE + 'Z"/>';
          if (i === peak) svg += '<text x="' + (x + barW / 2) + '" y="' + (y - 4) + '" class="chart-value">' + count + '</text>';
        }
        // A full-height invisible target so hovering anywhere in the slot shows the tooltip.
        svg += '<rect x="' + (i * slot) + '" y="0" width="' + slot + '" height="' + BASE + '" class="chart-hit"><title>' +
          label + ' · ' + count + (count === 1 ? ' order' : ' orders') + '</title></rect>';
        if (i % 2 === 1) svg += '<text x="' + (x + barW / 2) + '" y="' + (H - 6) + '" class="chart-axis">' + label.slice(0, 2) + 'h</text>';
      });
      svg += '</svg>';

      const card = glanceCard('Orders per hour', 'Open orders, last 8 hours');
      const chart = el('div', null, 'glance-chart');
      chart.innerHTML = svg;
      card.append(chart);
      return card;
    }

    // Donut of the open orders by kitchen status, using the same colours as the queue columns.
    function statusMixCard(orders) {
      const card = glanceCard('Kitchen status', orders.length + (orders.length === 1 ? ' open order' : ' open orders'));
      const body = el('div', null, 'status-mix');
      const total = orders.length;
      const GAP = total > 1 ? 1.2 : 0;  // a sliver of card colour between slices, in % of the ring

      let svg = '<svg viewBox="0 0 42 42" role="img" aria-label="Open orders by kitchen status">' +
        '<circle cx="21" cy="21" r="15.9" class="donut-track" pathLength="100"/>';
      let offset = 0;
      const legend = el('ul', null, 'status-legend');
      for (const def of STATUS_COLUMNS) {
        const count = orders.filter(o => o.status === def.status).length;
        const item = el('li', null, 'mix-' + def.status);
        item.append(el('span', null, 'mix-swatch'), el('span', def.label), el('strong', count));
        legend.append(item);
        if (!count) continue;
        const share = count / total * 100;
        svg += '<circle cx="21" cy="21" r="15.9" pathLength="100" class="donut-slice mix-' + def.status + '"' +
          ' stroke-dasharray="' + Math.max(0.5, share - GAP) + ' ' + (100 - Math.max(0.5, share - GAP)) + '"' +
          ' stroke-dashoffset="' + (25 - offset) + '"><title>' + def.label + ' · ' + count + '</title></circle>';
        offset += share;
      }
      svg += '<text x="21" y="22" class="donut-total">' + total + '</text>' +
        '<text x="21" y="27.5" class="donut-caption">open</text></svg>';

      const donut = el('div', null, 'donut');
      donut.innerHTML = svg;
      body.append(donut, legend);
      card.append(body);
      return card;
    }

    // Right-hand column: today's total + average table turn, then the chef's pick.
    function todaySide(total, orders) {
      const side = el('div', null, 'today-side');
      side.append(todayCard(total, orders), chefPickCard(orders));
      return side;
    }

    // Side card with the number of orders placed today (paid included, cancelled left out)
    // and how long open orders have been sitting on average, drawn as a small gauge.
    function todayCard(total, orders) {
      const card = el('div', null, 'today-card');
      const avg = orders.length
        ? Math.round(orders.reduce((sum, o) => sum + minutesSince(o.createdAt), 0) / orders.length)
        : null;

      const turn = el('div', null, 'today-turn');
      const turnText = el('div');
      turnText.append(
        el('div', 'Avg. table turn', 'today-label'),
        el('div', avg == null ? '—' : avg + ' min', 'today-turn-value'));
      turn.append(turnText, turnGauge(avg));

      card.append(
        el('div', 'Today\'s total orders', 'today-label'),
        el('div', total == null ? '—' : String(total), 'today-value'),
        turn);
      return card;
    }

    // Half-circle gauge; the needle sweeps from 0 to 60 minutes.
    function turnGauge(minutes) {
      const share = Math.min(1, (minutes || 0) / 60);
      const gauge = el('div', null, 'turn-gauge');
      gauge.innerHTML =
        '<svg viewBox="0 0 60 34" aria-hidden="true">' +
          '<path d="M6 30 A24 24 0 0 1 54 30" class="turn-gauge-track" pathLength="100"/>' +
          '<path d="M6 30 A24 24 0 0 1 54 30" class="turn-gauge-fill" pathLength="100" stroke-dasharray="' + (share * 100) + ' 100"/>' +
          '<line x1="30" y1="30" x2="30" y2="11" class="turn-gauge-needle" transform="rotate(' + (share * 180 - 90) + ' 30 30)"/>' +
          '<circle cx="30" cy="30" r="2.6" class="turn-gauge-hub"/>' +
        '</svg>';
      return gauge;
    }

    // The dish ordered most across open orders (by quantity), with a shortcut to New order.
    function chefPickCard(orders) {
      const counts = {};
      for (const order of orders) {
        for (const item of order.items) counts[item.name] = (counts[item.name] || 0) + item.quantity;
      }
      const names = Object.keys(counts);
      const dish = names.length ? names.reduce((a, b) => counts[b] > counts[a] ? b : a) : 'Fattoush Salad';

      const card = el('div', null, 'chef-pick');
      const text = el('div', null, 'chef-pick-text');
      text.append(el('div', 'Chef\'s pick of the day', 'chef-pick-title'), el('span', dish, 'chef-pick-tag'));
      if (document.querySelector('[data-section="neworder"]')) {
        const button = el('button', 'Order now');
        button.onclick = () => openSection('neworder');
        text.append(button);
      }
      card.append(text, dishImage(dish));
      return card;
    }

    // An <h2> with a small live-count pill next to it.
    function sectionHeading(title, countLabel) {
      const h = el('h2', title);
      h.append(el('span', countLabel, 'section-count'));
      return h;
    }

    function orderCard(order, table) {
      // Orders open more than 15 minutes and not yet served are flagged urgent — purely
      // visual, computed from the createdAt timestamp already on the order.
      const minutes = minutesSince(order.createdAt);
      const urgent = order.status !== 'SERVED' && minutes >= 15;

      const card = el('div', null, 'card order-card status-' + order.status + (urgent ? ' urgent' : ''));
      card.dataset.orderId = order.id;
      const head = el('div', null, 'row');
      head.append(
        el('span', table ? 'Table ' + table.tableNumber : 'Table ?', 'name'),
        el('span', order.status, 'badge ' + order.status));
      card.append(head);

      const meta = el('div', null, 'order-meta' + (urgent ? ' urgent-meta' : ''));
      if (urgent) meta.append(el('span', null, 'fa-solid fa-triangle-exclamation urgent-icon'));
      else meta.append(el('span', null, 'fa-solid fa-clock muted'));
      meta.append(el('span', timeText(order.createdAt) + ' · ' + minutes + 'm elapsed', urgent ? '' : 'muted'));
      if (urgent) meta.append(el('span', 'Urgent', 'urgent-tag'));
      card.append(meta);

      const items = el('div', null, 'order-items');
      for (const item of order.items) {
        const line = el('div', null, 'order-item');
        line.append(el('span', item.quantity, 'order-item-qty'), el('span', item.name));
        items.append(line);
        if (item.notes) items.append(el('div', 'Note: ' + item.notes, 'muted order-note'));
      }
      card.append(items);

      const subtotal = el('div', null, 'order-subtotal');
      subtotal.append(el('span', 'Subtotal', 'muted'), el('strong', money(orderTotal(order))));
      card.append(subtotal);

      const actions = el('div', null, 'actions');
      const next = NEXT[order.status];
      if (next) {
        const button = el('button');
        button.innerHTML = '<i class="fa-solid ' + next.icon + '"></i> ' + next.label;
        button.onclick = () => changeStatus(order.id, next.status);
        actions.append(button);
      }
      if (order.status === 'PENDING') {
        const cancel = el('button', 'Cancel order', 'secondary');
        cancel.onclick = () => changeStatus(order.id, 'CANCELLED');
        actions.append(cancel);
      }
      card.append(actions);
      return card;
    }

    async function changeStatus(orderId, status) {
      try {
        await api('/api/staff/orders/' + orderId + '/status', 'PATCH', { status: status }, auth);
        say('');
        refreshOrders();
      } catch (e) { handleError(e); }
    }

    function payCard(table, orders) {
      const card = el('div', null, 'card pay-card');
      const total = orders.reduce((sum, o) => sum + orderTotal(o), 0);
      let knownPoints = null;   // last points balance looked up for the typed phone number

      const head = el('div', null, 'pay-card-head');
      const tableInfo = el('div');
      tableInfo.append(
        el('div', 'Table ' + table.tableNumber, 'name'),
        el('div', orders.length + (orders.length === 1 ? ' order' : ' orders') + ' · all served', 'muted'));
      const icon = el('span', null, 'pay-card-icon');
      icon.innerHTML = '<i class="fa-solid fa-receipt"></i>';
      head.append(tableInfo, icon);
      card.append(head);

      const items = orders.flatMap(o => o.items);
      card.append(el('div', items.map(i => i.quantity + '× ' + i.name).join(', '), 'muted pay-summary'));

      const amountValue = el('strong', money(total), 'pay-amount');
      const amountRow = el('div', null, 'pay-amount-row');
      amountRow.append(el('span', 'Total amount due', 'muted'), amountValue);
      card.append(amountRow);
      const discountNote = el('p', '', 'muted');
      card.append(discountNote);

      card.append(el('label', 'Customer phone number (optional, for loyalty points)'));
      const phone = el('input');
      phone.type = 'tel';
      phone.value = phones[table.qrCodeHash] || '';
      phone.oninput = () => {
        phones[table.qrCodeHash] = phone.value;   // survives the 5-second redraw
        knownPoints = null;
        updatePreview();
      };
      // A different phone means a different balance, so look it up fresh once staff
      // move on — this is a preview only, the server always recalculates at payment.
      phone.onblur = async () => {
        const value = phone.value.trim();
        if (!value) return;
        try {
          const customer = await api('/api/loyalty/lookup', 'POST', { phoneNumber: value });
          knownPoints = customer.loyaltyPoints;
        } catch (e) {
          knownPoints = null;
        }
        updatePreview();
      };
      card.append(phone);

      const loyaltyTiers = buildLoyaltyTierCheckboxes(() => knownPoints, updatePreview);
      card.append(loyaltyTiers.container);

      function updatePreview() {
        loyaltyTiers.refreshAvailability();
        const tier = loyaltyTiers.selectedTier();
        let discounted = total;
        let note = '';
        if (tier) {
          discounted = total * (1 - tier.rate);
          note = Math.round(tier.rate * 100) + '% loyalty discount applied';
        } else if (knownPoints == null) {
          note = 'Enter the phone number to unlock a discount tier';
        } else {
          note = 'Not enough points yet for a discount';
        }
        amountValue.textContent = money(discounted);
        discountNote.textContent = note;
        button.innerHTML = '<i class="fa-solid fa-circle-check"></i> Collect ' + money(discounted);
      }

      const button = el('button');
      button.onclick = () => pay(table, loyaltyTiers.selectedTier());
      const payActions = el('div', null, 'actions');
      payActions.append(button);
      card.append(payActions);

      updatePreview();
      return card;
    }

    async function pay(table, tier) {
      const phone = (phones[table.qrCodeHash] || '').trim();
      const body = {};
      if (phone) body.phoneNumber = phone;
      if (tier) body.discountTier = String(tier.points);
      try {
        const receipt = await api('/api/staff/orders/table/' + encodeURIComponent(table.qrCodeHash) + '/pay',
                                  'POST', body, auth);
        delete phones[table.qrCodeHash];
        say('Table ' + table.tableNumber + ' is paid.');
        showReceipt(receipt);
        refreshOrders();
      } catch (e) { handleError(e); }
    }

    function showReceipt(receipt) {
      const card = el('div', null, 'card');
      card.append(el('h2', 'Receipt · Table ' + receipt.tableNumber));
      for (const item of receipt.items) {
        const line = el('div', null, 'row');
        line.append(el('span', item.quantity + ' × ' + item.name),
                    el('span', money(Number(item.unitPrice) * item.quantity)));
        card.append(line);
      }
      const totalLine = el('div', null, 'row');
      totalLine.append(el('strong', 'Total'), el('strong', money(receipt.total)));
      card.append(totalLine);
      if (receipt.discountApplied) card.append(el('div', 'Loyalty discount applied', 'ok'));

      card.append(el('div', 'Paid at the counter', 'muted'));
      card.append(el('div', new Date(receipt.paidAt).toLocaleString(), 'muted'));
      if (receipt.customerPhone) card.append(el('div', 'Loyalty number: ' + receipt.customerPhone, 'muted'));

      const close = el('button', 'Close', 'secondary');
      close.onclick = () => receiptBox.replaceChildren();
      const actions = el('div', null, 'actions');
      actions.append(close);
      card.append(actions);
      receiptBox.replaceChildren(card);
    }

    // ---------- New order: staff choose the food for a table ----------

    async function showNewOrder() {
      try {
        const tables = await api('/api/staff/tables', 'GET', null, auth);
        tables.sort((a, b) => a.tableNumber - b.tableNumber);
        if (tables.length === 0) {
          panel.replaceChildren(emptyState('fa-chair', 'There are no tables yet.'));
          return;
        }

        const select = el('select');
        for (const table of tables) {
          const option = el('option', 'Table ' + table.tableNumber + (table.status === 'OCCUPIED' ? ' (occupied)' : ''));
          option.value = table.qrCodeHash;
          select.append(option);
        }

        const menuLayout = el('div', null, 'menu-layout');
        const categoryNav = el('div', null, 'category-nav');
        const dishGrid = el('div', null, 'dish-grid');
        menuLayout.append(categoryNav, dishGrid);

        const cart = {};     // dish id -> { dish, quantity, qtyText, noteInput }
        const count = el('span', '0 items');
        const total = el('strong', '0.00');
        const send = el('button', 'Send to kitchen');
        send.disabled = true;

        const update = () => {
          let n = 0, sum = 0;
          for (const line of Object.values(cart)) {
            n += line.quantity;
            sum += line.quantity * Number(line.dish.price);
          }
          count.textContent = n + (n === 1 ? ' item' : ' items');
          total.textContent = money(sum);
          send.disabled = n === 0;
        };

        // Dishes are grouped by category in a vertical nav on the left; picking a
        // category swaps the grid on the right, so only one category shows at a time.
        let menuByCategory = {};
        const showCategory = (category) => {
          for (const button of categoryNav.children) {
            button.classList.toggle('active', button.dataset.category === category);
          }
          dishGrid.replaceChildren();
          for (const dish of menuByCategory[category] || []) {
            dishGrid.append(dishCard(dish, cart, update));
          }
        };

        // The menu is loaded for the chosen table. Choosing another table starts a new order.
        const loadMenu = async () => {
          try {
            const menu = await api('/api/menu?t=' + encodeURIComponent(select.value));
            for (const key of Object.keys(cart)) delete cart[key];

            menuByCategory = {};
            for (const dish of menu) {
              (menuByCategory[dish.category] = menuByCategory[dish.category] || []).push(dish);
            }
            const categories = Object.keys(menuByCategory);

            categoryNav.replaceChildren();
            for (const category of categories) {
              const button = el('button', category, 'secondary');
              button.dataset.category = category;
              button.onclick = () => showCategory(category);
              categoryNav.append(button);
            }

            if (categories.length) showCategory(categories[0]);
            else dishGrid.replaceChildren(emptyState('fa-utensils', 'This table has no available dishes.'));
            update();
          } catch (e) { handleError(e); }
        };
        select.onchange = loadMenu;

        send.onclick = async () => {
          const lines = Object.values(cart)
            .filter(line => line.quantity > 0)
            .map(line => ({
              menuItemId: line.dish.id,
              quantity: line.quantity,
              notes: line.noteInput.value.trim() || null
            }));
          const tableName = select.options[select.selectedIndex].text.replace(' (occupied)', '');
          send.disabled = true;
          try {
            await api('/api/staff/orders/table/' + encodeURIComponent(select.value), 'POST', lines, auth);
            say('Order sent to the kitchen for ' + tableName + '.');
            loadMenu();      // clears the order
          } catch (e) { handleError(e); update(); }
        };

        const bar = el('div', null, 'cart-bar');
        const barRow = el('div', null, 'row');
        const summary = el('div');
        summary.append(count, ' · ', total);
        barRow.append(summary, send);
        bar.append(barRow);

        const tableField = el('div', null, 'form-card');
        tableField.append(el('label', 'Table'), select);
        panel.replaceChildren(pageBanner('banner-neworder', 'Where the next great meal begins.'), tableField, menuLayout, bar);
        loadMenu();
      } catch (e) { handleError(e); }
    }

    // One dish tile: a uniform photo on top, then details and +/- controls. "cart" is
    // filled as staff choose. The image itself comes from app.js's dishImage() helper.
    function dishCard(dish, cart, onChange) {
      const card = el('div', null, 'dish-card');
      const imageWrap = dishImage(dish.name);
      const qtyBadge = el('span', '0', 'qty-badge hidden');
      imageWrap.append(qtyBadge);
      card.append(imageWrap);

      const body = el('div', null, 'dish-card-body');
      body.append(el('div', dish.name, 'name'));
      const allergens = dish.allergens || [];
      body.append(el('div', money(dish.price), 'dish-price'));
      if (allergens.length) body.append(el('div', 'Contains: ' + allergens.join(', '), 'muted'));

      const qty = el('div', null, 'qty');
      const minus = el('button', '-', 'secondary');
      const qtyText = el('span', '0');
      const plus = el('button', '+', 'secondary');
      qty.append(minus, qtyText, plus);
      body.append(qty);

      const noteInput = el('input', null, 'note hidden');
      noteInput.placeholder = 'Note for the kitchen (optional)';
      body.append(noteInput);
      card.append(body);

      cart[dish.id] = { dish: dish, quantity: 0, qtyText: qtyText, noteInput: noteInput };
      const change = (step) => {
        const line = cart[dish.id];
        line.quantity = Math.max(0, line.quantity + step);
        qtyText.textContent = line.quantity;
        qtyBadge.textContent = line.quantity;
        qtyBadge.classList.toggle('hidden', line.quantity === 0);
        card.classList.toggle('in-cart', line.quantity > 0);
        noteInput.classList.toggle('hidden', line.quantity === 0);
        onChange();
      };
      minus.onclick = () => change(-1);
      plus.onclick = () => change(1);
      return card;
    }

    // ---------- Menu (admin): add, edit, change price, delete ----------

    // Deleting a menu item is a soft delete (same /available endpoint as before) so
    // past orders and receipts still show the item correctly — it just drops out of
    // the admin's visible list and off the guest menu. Restore brings it back.
    async function showMenu() {
      try {
        const items = await api('/api/admin/menu-items', 'GET', null, auth);
        const visible = items.filter(i => i.available);
        const deleted = items.filter(i => !i.available);

        const formBox = el('div', null, 'card form-card');
        openItemForm(formBox, null);

        const table = el('table', null, 'list');
        const head = el('tr');
        for (const title of ['Name', 'Category', 'Price', 'Allergens', '']) head.append(el('th', title));
        table.append(head);

        for (const item of visible) {
          const row = el('tr');
          row.append(el('td', item.name), el('td', item.category), el('td', money(item.price)),
                     el('td', (item.allergens || []).join(', ')));

          const edit = el('button', 'Edit', 'secondary');
          edit.onclick = () => { openItemForm(formBox, item); formBox.scrollIntoView(); };

          const del = el('button', 'Delete', 'secondary');
          del.onclick = async () => {
            if (!confirm('Delete "' + item.name + '"? It will come off the guest menu, but you can restore it from "Deleted items" below.')) return;
            try {
              await api('/api/admin/menu-items/' + item.id, 'DELETE', null, auth);
              say(item.name + ' deleted.');
              showMenu();
            } catch (e) { handleError(e); }
          };

          const cell = el('td');
          cell.append(edit, ' ', del);
          row.append(cell);
          table.append(row);
        }

        const sections = [formBox, el('h2', 'Menu items'),
          visible.length ? table : emptyState('fa-utensils', 'No menu items yet. Add one above.')];

        if (deleted.length) {
          const toggle = el('button', 'Show deleted items (' + deleted.length + ')', 'secondary');
          const deletedTable = el('table', null, 'list hidden');
          const deletedHead = el('tr');
          for (const title of ['Name', 'Category', 'Price', '']) deletedHead.append(el('th', title));
          deletedTable.append(deletedHead);
          for (const item of deleted) {
            const row = el('tr');
            const restore = el('button', 'Restore', 'secondary');
            restore.onclick = async () => {
              try {
                await api('/api/admin/menu-items/' + item.id + '/available', 'PATCH', { available: true }, auth);
                say(item.name + ' restored.');
                showMenu();
              } catch (e) { handleError(e); }
            };
            const cell = el('td');
            cell.append(restore);
            row.append(el('td', item.name), el('td', item.category), el('td', money(item.price)), cell);
            deletedTable.append(row);
          }
          toggle.onclick = () => {
            deletedTable.classList.toggle('hidden');
            toggle.textContent = (deletedTable.classList.contains('hidden') ? 'Show' : 'Hide') + ' deleted items (' + deleted.length + ')';
          };
          sections.push(toggle, deletedTable);
        }

        panel.replaceChildren(pageBanner('banner-menu', 'Crafted dishes, thoughtfully served.'), ...sections);
      } catch (e) { handleError(e); }
    }

    // Fills the form box for a new item (item = null) or for editing an item.
    function openItemForm(box, item) {
      box.replaceChildren(el('h2', item ? 'Edit: ' + item.name : 'Add new menu item'));
      const fields = {};
      // 'half' fields sit two to a row; 'full' fields span the whole form width.
      const spec = [
        ['name', 'Name', 'text', 'half'],
        ['category', 'Category', 'text', 'half'],
        ['price', 'Price (QAR)', 'number', 'half'],
        ['ingredients', 'Ingredients (separated by commas)', 'text', 'full'],
        ['allergens', 'Allergens (separated by commas)', 'text', 'full']
      ];
      const grid = el('div', null, 'form-grid');
      for (const [key, label, type, width] of spec) {
        const field = el('div', null, 'form-field ' + width);
        field.append(el('label', label));
        fields[key] = el('input');
        fields[key].type = type;
        if (type === 'number') { fields[key].step = '0.01'; fields[key].min = '0'; }
        field.append(fields[key]);
        grid.append(field);
      }
      box.append(grid);
      if (item) {
        fields.name.value = item.name;
        fields.category.value = item.category;
        fields.price.value = item.price;
        fields.ingredients.value = (item.ingredients || []).join(', ');
        fields.allergens.value = (item.allergens || []).join(', ');
      }

      const split = (text) => text.split(',').map(part => part.trim()).filter(part => part);
      const save = el('button', item ? 'Save changes' : 'Add item');
      save.onclick = async () => {
        const body = {
          name: fields.name.value,
          category: fields.category.value,
          price: fields.price.value === '' ? null : Number(fields.price.value),
          ingredients: split(fields.ingredients.value),
          allergens: split(fields.allergens.value)
        };
        try {
          if (item) await api('/api/admin/menu-items/' + item.id, 'PUT', body, auth);
          else await api('/api/admin/menu-items', 'POST', body, auth);
          say(item ? 'Saved.' : 'Item added.');
          showMenu();
        } catch (e) { handleError(e); }
      };

      const cancel = el('button', 'Cancel', 'secondary');
      cancel.onclick = () => openItemForm(box, null);

      const actions = el('div', null, 'actions');
      actions.append(save, cancel);
      box.append(actions);
    }

    // ---------- Table QR codes ----------

    async function showQr() {
      try {
        const tables = await api('/api/staff/tables', 'GET', null, auth);
        tables.sort((a, b) => a.tableNumber - b.tableNumber);

        const address = el('input');
        address.value = location.origin;
        const grid = el('div', null, 'grid');
        const draw = () => {
          grid.replaceChildren();
          const base = address.value.trim().replace(/\/+$/, '');
          if (!/^https?:\/\//.test(base)) {
            grid.append(el('p', 'The address must start with http:// or https://', 'error'));
            return;
          }
          for (const table of tables) grid.append(qrCard(table, base));
        };
        address.oninput = draw;
        draw();

        const print = el('button', 'Print', 'secondary');
        print.onclick = () => window.print();
        const controls = el('div', null, 'no-print');
        controls.append(
          el('p', 'Each table has its own code. Print these and put one on each table.', 'muted'),
          el('label', 'Address guests use to open this app'),
          address,
          el('p', 'localhost only works on this computer. For phones, use this computer\'s IP address, for example http://192.168.1.20:8080', 'muted'),
          print);
        panel.replaceChildren(pageBanner('banner-qr', 'A seamless start to every visit.'), controls, grid);
      } catch (e) { handleError(e); }
    }

    function qrCard(table, base) {
      const link = base + '/?t=' + encodeURIComponent(table.qrCodeHash);
      const card = el('div', null, 'card qr');
      card.append(el('div', 'Table ' + table.tableNumber, 'name'));

      if (typeof qrcode === 'function') {
        const qr = qrcode(0, 'M');
        qr.addData(link);
        qr.make();
        const image = el('img');
        image.src = qr.createDataURL(6, 2);
        image.alt = 'QR code for table ' + table.tableNumber;
        card.append(image);
      } else {
        card.append(el('p', 'The QR library did not load. Check your internet connection and reload.', 'error'));
      }

      const anchor = el('a', link);
      anchor.href = link;
      anchor.target = '_blank';
      card.append(anchor);
      return card;
    }

            row.append(el('td', person.username), el('td', person.fullName), cell);
            deactivatedTable.append(row);
          }
          toggle.onclick = () => {
            deactivatedTable.classList.toggle('hidden');
            toggle.textContent = (deactivatedTable.classList.contains('hidden') ? 'Show' : 'Hide') + ' deactivated staff (' + deactivated.length + ')';
          };
          sections.push(toggle, deactivatedTable);
        }

        // Visual-only count from the staff list already fetched above; no extra API calls.
        const stats = statsRow([
          { icon: 'fa-users', value: people.length, label: 'Staff accounts' },
          { icon: 'fa-user-check', value: active.length, label: 'Active accounts', accent: true },
          { icon: 'fa-user-xmark', value: deactivated.length, label: 'Deleted accounts' }
        ]);

        panel.replaceChildren(pageBanner('banner-staff', 'Behind every great meal, a great team.'), stats, ...sections);
      } catch (e) { handleError(e); }
    }

    // ---------- Customers (admin) ----------

    async function showCustomers() {
      try {
        const customers = await api('/api/admin/customers', 'GET', null, auth);
        customers.sort((a, b) => b.loyaltyPoints - a.loyaltyPoints);

        const table = el('table', null, 'list');
        const head = el('tr');
        for (const title of ['Phone', 'Tier', 'Points', 'Paid orders']) head.append(el('th', title));
        table.append(head);
        for (const c of customers) {
          const row = el('tr');

          const phoneCell = el('td');
          phoneCell.append(el('span', null, 'fa-solid fa-phone phone-icon'), ' ' + c.phoneNumber);

          const tierCell = el('td');
          tierCell.append(el('span', c.tierLevel, 'tier-badge tier-' + c.tierLevel.toLowerCase()));

          row.append(phoneCell, tierCell, el('td', c.loyaltyPoints), el('td', c.totalOrders));
          table.append(row);
        }

        // Visual-only totals from the customer list already fetched above; no extra API calls.
        const totalOrders = customers.reduce((sum, c) => sum + c.totalOrders, 0);
        const stats = statsRow([
          { icon: 'fa-address-book', value: customers.length, label: 'Loyalty members' },
          { icon: 'fa-receipt', value: totalOrders, label: 'Paid orders total', accent: true }
        ]);

        const banner = pageBanner('banner-customers', 'Loyalty is earned, one visit at a time.');
        if (customers.length) panel.replaceChildren(banner, stats, table);
        else panel.replaceChildren(banner, emptyState('fa-address-book', 'No customers yet. They\'ll show up here after their first paid order.'));
      } catch (e) { handleError(e); }
    }

    // ---------- Start ----------

    document.getElementById('login-button').onclick = login;
    document.getElementById('password').onkeydown = (event) => { if (event.key === 'Enter') login(); };
    document.getElementById('logout-button').onclick = logout;

    // Page reloaded while logged in: check the saved login before showing the dashboard.
    const saved = sessionStorage.getItem('auth');
    if (saved) {
      api('/api/auth/me', 'GET', null, saved)
        .then(profile => { auth = saved; openDashboard(profile); })
        .catch(() => sessionStorage.removeItem('auth'));
    }
  </script>
</body>
</html>
